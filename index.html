<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杨古八 · 个人官方网站</title>
<style>
  :root{
    --bg:#0d0d12; --card:#17171f; --border:#2a2a36;
    --text:#f2f2f5; --muted:#9a9aa8; --accent:#ff5c1a; --accent2:#8b5cf6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.7; min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px}
  .hero{text-align:center;padding:30px 0 40px}
  .logo{
    width:92px;height:92px;border-radius:24px;margin:0 auto 20px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-size:40px;font-weight:700;color:#fff;box-shadow:0 12px 40px rgba(255,92,26,.28);
  }
  h1{font-size:34px;letter-spacing:2px}
  .tagline{color:var(--muted);margin-top:8px;font-size:15px}
  .badges{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .badge{
    padding:6px 16px;border:1px solid var(--border);border-radius:999px;
    font-size:13px;color:var(--muted);background:var(--card);
  }
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:24px;margin-top:20px;
  }
  .card h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
  .card p{color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .tile{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:20px;transition:.2s;
  }
  .tile:hover{border-color:var(--accent);transform:translateY(-2px)}
  .tile .t{font-weight:600;font-size:15px;margin-bottom:6px}
  .tile .d{color:var(--muted);font-size:13px}
  .links{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
  .links a{
    flex:1;min-width:100px;text-align:center;text-decoration:none;cursor:pointer;
    padding:14px 16px;border-radius:12px;font-size:15px;border:1px solid var(--border);
    color:var(--text);background:var(--card);transition:.2s;
  }
  .links a.hl{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:600}
  .links a:hover{transform:translateY(-2px)}
  footer{text-align:center;color:#55555f;font-size:12px;margin-top:48px}
  /* 二维码弹窗 */
  .modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;
    align-items:center;justify-content:center;padding:24px;
  }
  .modal-content{
    background:var(--card);border:1px solid var(--border);border-radius:20px;
    padding:24px;max-width:340px;width:100%;text-align:center;
  }
  .modal-content img{width:100%;border-radius:12px;background:#fff;display:block}
  .modal-content p{margin:16px 0;color:var(--text);font-size:15px}
  .modal-content button{
    padding:11px 34px;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:15px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="logo">杨</div>
      <h1>杨古八</h1>
      <p class="tagline">欢迎来到我的个人官方网站</p>
      <div class="badges">
        <span class="badge">潮流</span>
        <span class="badge">球鞋</span>
        <span class="badge">分享</span>
      </div>
    </div>

    <div class="card">
      <h2>关于我</h2>
      <p>你好，我是杨古八。这里是我的个人主页，用来记录我的爱好、分享和作品。后续会持续更新内容，欢迎关注。</p>
    </div>

    <div class="grid">
      <div class="tile">
        <div class="t">📦 作品 / 内容</div>
        <div class="d">我的精选内容、货架或项目，会陆续放在这里。</div>
      </div>
      <div class="tile">
        <div class="t">✍️ 动态 / 笔记</div>
        <div class="d">日常分享、心得和最新动态。</div>
      </div>
      <div class="tile">
        <div class="t">🔗 社交主页</div>
        <div class="d">抖音、小红书等平台入口，点下方按钮扫码关注。</div>
      </div>
      <div class="tile">
        <div class="t">📮 联系我</div>
        <div class="d">合作、交流都可以通过下方方式找到我。</div>
      </div>
    </div>

    <div class="card">
      <h2>联系我</h2>
      <div class="links">
        <a class="hl" onclick="showQR('wechat')">微信</a>
        <a onclick="showQR('douyin')">抖音</a>
        <a onclick="showQR('xhs')">小红书</a>
      </div>
      <p style="margin-top:14px">点击按钮，扫码找到我。</p>
    </div>

    <footer>© 2026 杨古八 · 个人官方网站</footer>
  </div>

  <!-- 二维码弹窗 -->
  <div id="qrModal" class="modal" onclick="hideQR()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <img id="qrImg" src="" alt="二维码">
      <p id="qrText"></p>
      <button onclick="hideQR()">关闭</button>
    </div>
  </div>

  <script>
    var qrs = {
      wechat: {img:'images/wechat.png', text:'微信扫码，添加我为朋友'},
      douyin: {img:'images/douyin.png', text:'抖音扫码关注我 · 杨古八'},
      xhs:    {img:'images/xhs.jpg',    text:'小红书扫码找到我'}
    };
    function showQR(key){
      document.getElementById('qrImg').src = qrs[key].img;
      document.getElementById('qrText').innerText = qrs[key].text;
      document.getElementById('qrModal').style.display = 'flex';
    }
    function hideQR(){
      document.getElementById('qrModal').style.display = 'none';
    }
  </script>
</body>
</html>
